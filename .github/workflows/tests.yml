name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run tests
        run: node --test tests/test_*.js
      - name: Validate CCDD contracts
        run: python3 scripts/validate_contracts.py knowledge/contracts
