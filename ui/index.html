<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Flow City — UI mínima</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Flow City — grid, rutas y tráfico (mínimo)</h1>

<div class="toolbar">
  <label for="modo">Modo:</label>
  <select id="modo">
    <option value="construir">Construir</option>
    <option value="ruta">Conectar ruta</option>
    <option value="viaje">Enviar viaje</option>
  </select>
  <button id="avanzarTickProduccion">Avanzar tick de producción</button>
  <span id="saldo" class="saldo"></span>
</div>

<div class="toolbar" id="panelConstruir">
  <label for="categoria">Categoría:</label>
  <select id="categoria">
    <option value="agricultura">agricultura</option>
    <option value="reforestacion">reforestacion</option>
    <option value="mineria">mineria</option>
    <option value="pesca">pesca</option>
    <option value="no_extractiva">no_extractiva</option>
    <option value="residencial">residencial</option>
    <option value="industrial">industrial</option>
    <option value="casa">casa (multi-celda)</option>
  </select>
  <span id="nivelCasaWrap" style="display:none">
    <label for="nivelCasa">Nivel:</label>
    <select id="nivelCasa">
      <option value="S">S (2x2)</option>
      <option value="M">M (3x2)</option>
      <option value="L">L (3x3)</option>
    </select>
  </span>
  <span id="costoConstruccion" class="costo"></span>
</div>

<div class="toolbar" id="panelRuta" style="display:none">
  <label for="tipoRuta">Tipo:</label>
  <select id="tipoRuta">
    <option value="carretera">carretera</option>
    <option value="ferrocarril">ferrocarril</option>
    <option value="maritima">maritima</option>
    <option value="subte">subte</option>
  </select>
  <label for="capacidadRuta">Capacidad:</label>
  <input type="number" id="capacidadRuta" value="10" min="1" style="width:60px">
  <span id="rutaEstado"></span>
</div>

<div class="toolbar" id="panelViaje" style="display:none">
  <label for="origenViaje">Origen:</label>
  <select id="origenViaje"></select>
  <label for="destinoViaje">Destino:</label>
  <select id="destinoViaje"></select>
  <label for="tipoTraficoViaje">Tráfico:</label>
  <select id="tipoTraficoViaje">
    <option value="mercaderia">mercaderia</option>
    <option value="personas">personas</option>
  </select>
  <label for="cantidadViaje">Cantidad:</label>
  <input type="number" id="cantidadViaje" value="10" min="1" style="width:60px">
  <button id="enviarViaje">Enviar</button>
</div>

<div id="mensaje"></div>

<div id="gridWrap">
  <div id="grid"></div>
  <svg id="overlay"></svg>
</div>

<script src="cjs-loader.js"></script>
<script src="app.js"></script>
</body>
</html>
